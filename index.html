<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF4F1" />
    <title>Meu Mural Anime ✦</title>
    <meta name="description" content="Um mural de cenas de anime escolhidas a dedo: céus, campos e cantinhos para relaxar." />

    <!-- Prévia bonita quando o link é compartilhado (WhatsApp, Instagram...) -->
    <meta property="og:title" content="Meu Mural Anime ✦" />
    <meta property="og:description" content="Um mural de cenas de anime escolhidas a dedo." />
    <meta property="og:type" content="website" />

    <!-- Aplica o tema guardado ANTES de desenhar a página, para não piscar rosa -->
    <script>
      try {
        var t = localStorage.getItem('mural-tema')
        if (t && /^[a-z-]{1,20}$/.test(t)) {
          document.documentElement.dataset.tema = t
          var cores = { lavanda: '#F6F2FF', menta: '#F0FAF5', ceu: '#F1F7FF', 'por-do-sol': '#FFF6EC', noite: '#1E1626', claro: '#F5F5F4', escuro: '#141416', papel: '#F4EEE3' }
          if (cores[t]) document.querySelector('meta[name="theme-color"]').content = cores[t]
        }
      } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@500;700&family=DM+Mono:wght@500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
